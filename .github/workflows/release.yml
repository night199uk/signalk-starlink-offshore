name: Release

# Triggered by pushing a version tag (v*). Authenticates to npm with trusted
# publishing (OIDC) - no NPM_TOKEN secret; provenance is automatic - and also
# creates the GitHub release for the tag.
#
# One-time setup on npmjs.com (Package -> Settings -> Trusted Publisher ->
# GitHub Actions):
#   Organization or user: night199uk
#   Repository:           signalk-starlink-offshore
#   Workflow filename:    release.yml
#   Environment name:     (leave blank)
#   Allowed actions:      enable "npm publish"
#
# If the package does not exist on npm yet, publish a first version manually
# (npm publish) to create it, then add the trusted publisher.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      # Trusted publishing uses the workflow's OIDC token; no NPM_TOKEN secret
      # is required. Provenance is generated automatically.
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
